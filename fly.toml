# fly.toml app configuration file for Dave Timi EdTech Systems
app = "dave-timi-edtech"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SQLITE_DB_PATH = "/app/data/dt_edtech.sqlite"

# Persistent Volume for SQLite Database and Documents
[mounts]
  source = "dt_data"
  destination = "/app/data"
  initial_size = "3gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
